<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Xanadu Cyber inspired logo -->
  <!-- Outer glow effect -->
  <defs>
    <linearGradient id="xanaduGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="20" cy="20" r="18" fill="url(#xanaduGradient)" opacity="0.1"/>
  
  <!-- Main X shape with modern design -->
  <g filter="url(#glow)">
    <!-- Left diagonal of X -->
    <path d="M 8 8 L 20 20 L 8 32" 
          stroke="url(#xanaduGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Right diagonal of X -->
    <path d="M 32 8 L 20 20 L 32 32" 
          stroke="url(#xanaduGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Center hexagon representing cyber/tech -->
    <polygon points="20,14 25,17 25,23 20,26 15,23 15,17" 
             fill="url(#xanaduGradient)" 
             opacity="0.8"
             filter="url(#innerGlow)"/>
    
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Orbital rings for cyber effect -->
  <ellipse cx="20" cy="20" rx="16" ry="6" 
           stroke="url(#xanaduGradient)" 
           stroke-width="0.5" 
           fill="none" 
           opacity="0.3"
           transform="rotate(45 20 20)"/>
  <ellipse cx="20" cy="20" rx="16" ry="6" 
           stroke="url(#xanaduGradient)" 
           stroke-width="0.5" 
           fill="none" 
           opacity="0.3"
           transform="rotate(-45 20 20)"/>
</svg>